<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-transparent shadow-sm fixed-top"
      style="backdrop-filter: blur(8px); background-color: rgba(0, 0, 0, 0.4)"
    >
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="{{ url_for('static', filename='assets/bookstore.png') }}"
            alt="Bookstore Logo"
            class="me-2"
            style="height: 50px; width: auto"
          />
          <span class="fw-bold fs-4 text-white">Bookstore</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a
                class="nav-link text-white fw-semibold"
                href="index.html"
                id="nav-manage"
              >
                <i class="bi bi-book-fill me-1"></i>Manage
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-white fw-semibold"
                href="{{ url_for('view_page') }}"
                id="nav-view"
              >
                <i class="bi bi-table me-1"></i>View
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="manage-container">
      <div class="CRUD-container">
        <h1>Manage Books</h1>
        <form class="form-manage needs-validation" novalidate>
          <div class="mb-3">
            <label for="formInput1" class="form-label">Title:</label>
            <input
              type="text"
              id="formInput1"
              class="form-control"
              placeholder="Enter book title"
              required
            />
            <div class="invalid-feedback">Please choose a title.</div>
          </div>
          <div class="mb-3">
            <label for="formInput2" class="form-label">Author:</label>
            <input
              type="text"
              id="formInput2"
              class="form-control"
              placeholder="Enter the author"
              required
            />
            <div class="invalid-feedback">Please write the author.</div>
          </div>
          <div class="mb-3">
            <label for="formInput3" class="form-label">Publishing Date:</label>
            <input type="date" id="formInput3" class="form-control" required />
            <div class="invalid-feedback">Please choose a date.</div>
          </div>
          <div class="mb-3">
            <label for="formFile1" class="form-label"
              >Book cover (optional):</label
            >
            <input type="file" id="formFile1" class="form-control" />
          </div>
          <div class="CRUDbuttons d-flex gap-2">
            <button type="submit" class="btn btn primary">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
      integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
      crossorigin="anonymous"
    ></script>
    <script>
      (function () {
        "use strict";
        window.addEventListener(
          "load",
          function () {
            const form = document.querySelector(".form-manage");
            form.addEventListener(
              "submit",
              function (event) {
                if (!form.checkValidity()) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                form.classList.add("was-validated");
              },
              false
            );
          },
          false
        );
      })();
    </script>
  </body>
</html>
